[versions]
# AGP 9.2.1 配 Gradle 9.5.0（官方 Example 同款）
agp = "9.2.1"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
flexi-locale = "1.0.2"
kavaref-bom = "1.1.0"
betterandroid = "1.0.9"
libsu = "5.2.2"
drawabletoolbox = "1.0.7"
gson = "2.14.0"
# The project current support min sdk version is 26 (api102 下限),
# suppress the warning about using newer versions of dependencies that may require higher min sdk version.
androidx-core-ktx = "1.13.1"
androidx-appcompat = "1.7.0"
material = "1.11.0"
androidx-constraintlayout = "2.1.4"
junit = "4.13.2"
androidx-test-junit = "1.3.0"
androidx-test-espresso-core = "3.7.0"
# libxposed 现代 API（api102）
xposed-api = "102.0.0"
xposed-service = "102.0.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
flexi-locale = { id = "com.highcapable.flexilocale", version.ref = "flexi-locale" }

[libraries]
kavaref-bom = { group = "com.highcapable.kavaref", name = "kavaref-bom", version.ref = "kavaref-bom" }
kavaref-core = { group = "com.highcapable.kavaref", name = "kavaref-core" }
kavaref-android = { group = "com.highcapable.kavaref", name = "kavaref-android", version = "1.0.3" }
kavaref-extension = { group = "com.highcapable.kavaref", name = "kavaref-extension" }
betterandroid-ui-extension = { group = "com.highcapable.betterandroid", name = "ui-extension", version.ref = "betterandroid" }
libsu = { group = "com.github.topjohnwu.libsu", name = "core", version.ref = "libsu" }
drawabletoolbox = { group = "com.github.duanhong169", name = "drawabletoolbox", version.ref = "drawabletoolbox" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version = "1.3.2" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-test-espresso-core = { group = "androidx.test.ext", name = "espresso-core", version.ref = "androidx-test-espresso-core" }
# libxposed 现代 API（本地 jar，绕开 compileSdk 37 检查）
